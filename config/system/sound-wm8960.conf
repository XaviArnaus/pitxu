# ALSA Device to Index Configuration File
# Place this file in /etc/modprobe.d/asound.conf
# Change the index number to the one desired, use "aplay -l" to list all audio cards and their device numbers
# Make sure that the index here matches the Card index in the asound.conf file, otherwise the audio server won't work.
# Example: index=0 here means that the audio card will be available as "hw:0,0" in the asound.conf file 
# (The first 0 on 0,0. The second 0 is the device number, which is usually 0 for the default audio device)

options snd slots=snd_soc_wm896 index=0